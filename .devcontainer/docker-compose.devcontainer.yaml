services:
  target-app:
    working_dir: /workspace
    volumes:
      - .:/workspace:cached
      - workspace_node_modules:/workspace/node_modules
    command: [ "npm", "run", "dev:target" ]

  dashboard:
    working_dir: /workspace
    volumes:
      - .:/workspace:cached
      - workspace_node_modules:/workspace/node_modules
    command: [ "npm", "run", "dev:dashboard" ]

  server:
    working_dir: /workspace
    volumes:
      - .:/workspace:cached
      - workspace_node_modules:/workspace/node_modules
    command: [ "npm", "run", "dev:server" ]

  python-services:
    working_dir: /workspace/python-services
    volumes:
      - ./python-services:/workspace/python-services:cached
    command: ["sleep", "infinity"]

volumes:
  workspace_node_modules:
