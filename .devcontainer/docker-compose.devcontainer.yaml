services:
  target-app:
    working_dir: /workspace
    volumes:
      - .:/workspace:cached
      - target_node_modules:/workspace/node_modules
    command:
      - sh
      - -lc
      - npm ci && npm --prefix /workspace/apps/target-app run dev -- --host 0.0.0.0 --port 5173

  dashboard:
    working_dir: /workspace
    volumes:
      - .:/workspace:cached
      - dashboard_node_modules:/workspace/node_modules
    command:
      - sh
      - -lc
      - npm ci && npm --prefix /workspace/apps/dashboard run dev -- --host 0.0.0.0 --port 5174

  server:
    working_dir: /workspace
    volumes:
      - .:/workspace:cached
      - server_node_modules:/workspace/node_modules
    command:
      - sh
      - -lc
      - npm ci && exec sleep infinity

volumes:
  target_node_modules:
  dashboard_node_modules:
  server_node_modules: