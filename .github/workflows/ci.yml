name: Project CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend builds and mocked browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -w apps/dashboard
      - run: npm run build -w apps/target-app
      - run: npx playwright install --with-deps chromium
      - run: npm run test:requests -w apps/dashboard

  python:
    name: FastAPI contracts and local plan browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GROQ_API_KEY: ""
      PYTHONPATH: python-services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            python-services/requirements.txt
            python-services/requirements-test.txt
      - run: python -m pip install -r python-services/requirements-test.txt
      - run: python -X utf8 -m unittest discover -s python-services/tests -v
      - run: python -m playwright install --with-deps chromium
      - run: python -X utf8 -m unittest discover -s python-services/tests -p test_saved_plan_browser.py -v
        env:
          RUN_PLAN_BROWSER_TESTS: "1"

  migrations:
    name: PostgreSQL migration integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: qa_migration
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa_migration -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: python-services
      GROQ_API_KEY: ""
      MIGRATION_TEST_ADMIN_DSN: postgresql://qa_migration:ci-only-disposable@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            python-services/requirements.txt
            python-services/requirements-test.txt
      - run: python -m pip install -r python-services/requirements-test.txt
      - run: python -X utf8 -m unittest discover -s python-services/tests -p test_migrations_postgres.py -v
